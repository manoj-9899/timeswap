<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Location &amp; Delivery - SkillSwap</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#191c1e",
                        "surface": "#f7f9fb",
                        "on-primary-container": "#90d8cc",
                        "on-tertiary-fixed-variant": "#00504a",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed": "#00201d",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#8cd4c8",
                        "on-secondary": "#ffffff",
                        "outline": "#6f7977",
                        "on-error-container": "#93000a",
                        "primary-container": "#0b6057",
                        "inverse-surface": "#2d3133",
                        "surface-bright": "#f7f9fb",
                        "secondary": "#904d00",
                        "background": "#f7f9fb",
                        "surface-tint": "#1b6960",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#ffb77d",
                        "on-primary-fixed": "#00201c",
                        "secondary-container": "#fe932c",
                        "on-surface-variant": "#3f4947",
                        "on-primary-fixed-variant": "#005048",
                        "surface-dim": "#d8dadc",
                        "on-surface": "#191c1e",
                        "tertiary-container": "#006059",
                        "tertiary-fixed-dim": "#80d5cb",
                        "on-tertiary-container": "#83d9cf",
                        "surface-container-low": "#f2f4f6",
                        "tertiary-fixed": "#9cf2e8",
                        "surface-container-high": "#e6e8ea",
                        "tertiary": "#004641",
                        "error": "#ba1a1a",
                        "primary": "#00473f",
                        "secondary-fixed": "#ffdcc3",
                        "on-secondary-fixed": "#2f1500",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#8cd4c8",
                        "on-secondary-container": "#663500",
                        "primary-fixed": "#a8f0e4",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container": "#eceef0",
                        "surface-container-highest": "#e0e3e5",
                        "on-secondary-fixed-variant": "#6e3900",
                        "outline-variant": "#bec9c6"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "40px",
                        "md": "16px",
                        "xs": "4px",
                        "unit": "4px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "lg": "24px",
                        "sm": "8px"
                    },
                    "fontFamily": {},
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-sm": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface-container-low min-h-screen font-sans text-on-background antialiased flex flex-col justify-center items-center p-md md:p-lg">
<!-- Progress Bar (Top of Screen) -->
<div class="fixed top-0 left-0 w-full h-1 bg-surface-variant z-50">
<div class="h-full bg-primary w-1/2 transition-all duration-500 ease-in-out"></div>
</div>
<!-- Main Content Card -->
<main class="w-full max-w-2xl bg-surface-container-lowest rounded-lg border border-outline-variant shadow-[0px_2px_4px_rgba(15,23,42,0.04)] overflow-hidden">
<div class="p-lg md:p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col gap-sm">
<span class="font-label-md text-label-md text-primary tracking-widest uppercase">Step 2 of 4</span>
<h1 class="font-headline-lg text-headline-lg text-on-background">Where are you based?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We use your location to connect you with nearby skill-swappers if you prefer in-person exchanges.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg">
<!-- Location Inputs -->
<div class="flex flex-col md:flex-row gap-md w-full">
<div class="flex flex-col gap-xs flex-1">
<label class="font-label-md text-label-md text-on-surface" for="city">City</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:border-[2px] focus:ring-0 px-md py-sm font-body-md text-body-md text-on-background placeholder:text-on-surface-variant/50 transition-colors h-12" id="city" placeholder="e.g. San Francisco" type="text"/>
</div>
<div class="flex flex-col gap-xs flex-1">
<label class="font-label-md text-label-md text-on-surface" for="district">General District / Neighborhood</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:border-[2px] focus:ring-0 px-md py-sm font-body-md text-body-md text-on-background placeholder:text-on-surface-variant/50 transition-colors h-12" id="district" placeholder="e.g. Mission District" type="text"/>
</div>
</div>
<!-- Delivery Preference -->
<div class="flex flex-col gap-md">
<label class="font-label-md text-label-md text-on-surface">How do you prefer to swap skills?</label>
<div class="grid grid-cols-1 md:grid-cols-3 gap-md">
<!-- Option 1: Online -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="delivery_preference" type="radio" value="online"/>
<div class="h-full flex flex-col items-center text-center gap-sm p-md rounded border border-outline-variant bg-surface-container-lowest peer-checked:border-primary-container peer-checked:bg-primary-container/5 peer-checked:ring-1 peer-checked:ring-primary-container transition-all hover:bg-surface hover:shadow-[0px_4px_12px_rgba(15,23,42,0.06)]">
<span aria-hidden="true" class="material-symbols-outlined text-primary-container text-4xl mb-xs" data-icon="videocam">videocam</span>
<span class="font-headline-sm text-headline-sm text-on-background">Online Only</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Via video call</span>
</div>
</label>
<!-- Option 2: In-Person -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="delivery_preference" type="radio" value="in_person"/>
<div class="h-full flex flex-col items-center text-center gap-sm p-md rounded border border-outline-variant bg-surface-container-lowest peer-checked:border-primary-container peer-checked:bg-primary-container/5 peer-checked:ring-1 peer-checked:ring-primary-container transition-all hover:bg-surface hover:shadow-[0px_4px_12px_rgba(15,23,42,0.06)]">
<span aria-hidden="true" class="material-symbols-outlined text-primary-container text-4xl mb-xs" data-icon="group">group</span>
<span class="font-headline-sm text-headline-sm text-on-background">In-Person Only</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Local meetings</span>
</div>
</label>
<!-- Option 3: Both -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="delivery_preference" type="radio" value="both"/>
<div class="h-full flex flex-col items-center text-center gap-sm p-md rounded border border-outline-variant bg-surface-container-lowest peer-checked:border-primary-container peer-checked:bg-primary-container/5 peer-checked:ring-1 peer-checked:ring-primary-container transition-all hover:bg-surface hover:shadow-[0px_4px_12px_rgba(15,23,42,0.06)]">
<span aria-hidden="true" class="material-symbols-outlined text-primary-container text-4xl mb-xs" data-icon="swap_horiz">swap_horiz</span>
<span class="font-headline-sm text-headline-sm text-on-background">Both</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Flexible options</span>
</div>
</label>
</div>
</div>
<!-- Actions -->
<div class="flex justify-between items-center mt-md pt-lg border-t border-outline-variant">
<button class="px-lg py-sm font-label-md text-label-md text-primary-container bg-transparent border border-primary-container rounded-full hover:bg-primary-container/10 transition-colors" type="button">Back</button>
<button class="px-lg py-sm font-label-md text-label-md text-on-primary bg-primary-container rounded-full hover:opacity-90 transition-opacity" type="submit">Continue</button>
</div>
</form>
</div>
<!-- Privacy Banner -->
<div class="bg-surface px-lg py-md border-t border-outline-variant flex items-center gap-sm">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="lock">lock</span>
<p class="font-body-sm text-body-sm text-on-surface-variant"><strong>Private location guarantee:</strong> We only show your general district to other users. Your exact address is never shared until a swap is confirmed.</p>
</div>
</main>
</body></html>

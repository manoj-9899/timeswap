<div class="flex justify-between items-center w-full px-lg py-md max-w-container-max mx-auto">

</div>

<div class="w-full max-w-[600px] bg-surface-container-lowest rounded-lg border border-surface-variant shadow-[0px_2px_4px_rgba(15,23,42,0.04)] p-xl flex flex-col gap-lg">

<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">

</div>

<span class="material-symbols-outlined icon-check" style="font-size: 18px;">check</span>

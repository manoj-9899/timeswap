<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Top Navigation (Suppressed per instructions for linear/transactional intent) -->
<!-- Content Canvas -->
<main class="flex-grow flex items-center justify-center p-md md:p-lg">
<div class="bg-surface-container-lowest rounded-lg w-full max-w-lg border border-surface-variant" style="box-shadow: 0px 2px 4px rgba(15, 23, 42, 0.04);">
<!-- Progress Bar -->
<div class="w-full bg-surface-variant h-1 rounded-t-lg overflow-hidden">
<div class="bg-primary-container h-full w-1/4 transition-all duration-500"></div>
</div>
<div class="p-lg md:p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="text-center">
<span class="material-symbols-outlined text-primary-container text-4xl mb-md">person_add</span>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Create Your Identity</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Step 1 of 4: Let's set up your profile.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- @handle Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="handle">Unique @handle</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-sm text-on-surface-variant font-body-md text-body-md">@</span>
<input class="w-full pl-lg pr-md py-sm rounded border border-surface-variant bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md text-body-md text-on-surface outline-none" id="handle" name="handle" placeholder="username" type="text"/>
</div>
</div>
<!-- Display Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="displayName">Display Name</label>
<input class="w-full px-md py-sm rounded border border-surface-variant bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md text-body-md text-on-surface outline-none" id="displayName" name="displayName" placeholder="e.g. Jane Doe" type="text"/>
</div>
<!-- Personal Bio Textarea -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="bio">Tell the community about yourself</label>
<textarea class="w-full px-md py-sm rounded border border-surface-variant bg-surface-container-lowest focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md text-body-md text-on-surface outline-none resize-y" id="bio" name="bio" placeholder="I'm a designer looking to learn guitar..." rows="4"></textarea>
<p class="font-body-sm text-body-sm text-on-surface-variant">Minimum 30 characters</p>
</div>
<!-- Actions -->
<div class="pt-md mt-md border-t border-surface-variant flex justify-end">
<button class="bg-primary-container hover:opacity-90 active:scale-95 transition-all text-on-primary rounded-full px-lg py-sm font-label-md text-label-md flex items-center gap-xs" type="button">
                            Next Step
                            <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
